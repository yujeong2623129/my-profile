<!DOCTYPE html>
<html lang="ko">
    <head>
        <!-- 외부 CSS 파일을 연결하여 웹페이지 디자인을 적용 -->
        <link rel="stylesheet" href="style.css">

        <!-- 한글 등 다양한 문자를 올바르게 표시하기 위한 인코딩 설정 -->
        <meta charset="UTF-8">

        <!-- 브라우저 탭에 표시되는 제목 -->
        <title>홍유정 - 자기소개</title>
    </head>

    <body>
        <!-- 페이지 전체를 묶어 너비와 위치를 조절하는 영역 -->
        <div class="container">

            <!-- 상단 배너: 이름과 학과 및 프로젝트 소개 -->
            <div class="hero">
                <h1>홍유정</h1>
                <p>글로벌시스템융합과 1학년 · 강의실 VLM 프로젝트 팀원</p>
            </div>

            <!-- 자기소개 카드 -->
            <div class="card">
                <h2>소개</h2>
                <p>안녕하세요! 저는 글로벌시스템융합과 1학년 홍유정입니다. Python과 Java를 배우고 있으며, 일본 IT 취업을 목표로 공부하고 있습니다.</p>
            </div>

            <!-- 프로젝트에서 맡은 일을 목록으로 표시 -->
            <div class="card">
                <h2>프로젝트에서 맡은 일</h2>
                <ul>
                    <li>강의실 좌석 인식 시스템 소개 UCC 기획 및 콘티 구성</li>
                    <li>프로젝트 소개 영상 편집 및 기술 설명 시각화</li>
                </ul>
            </div>

            <!-- 공부 중인 기술을 각각 배지 형태로 표시 -->
            <div class="card">
                <h2>공부 중인 기술</h2>
                <span class="skill">HTML</span>
                <span class="skill">CSS</span>
                <span class="skill">Python</span>
                <span class="skill">Java</span>
            </div>

            <!-- GitHub 프로필로 이동하는 링크 -->
            <div class="card">
                <h2>연락처</h2>
                <a class="github-link" href="https://github.com/yujeong2623129">GitHub 바로가기</a>
            </div>

        </div>
    </body>
</html>
